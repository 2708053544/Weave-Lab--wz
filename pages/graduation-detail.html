    /* 背景装饰光斑层 */
    .glow-layer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .glow-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform;
      transition: transform 0.28s cubic-bezier(0.25, 0.1, 0.3, 1), opacity 0.28s ease;
    }
    .glow-blob.pressed {
      transform: scale(0.82, 0.86);
      opacity: 0.88;
    }
    .glow-blob.bounce {
      transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
    }
    .blob-1 { width: 1092px; height: 858px; left: calc(100% - 546px); top: -429px; background: radial-gradient(ellipse at center, rgba(170, 80, 255, 0.35) 0%, rgba(170, 80, 255, 0) 65%); }
    .blob-2 { width: 420px; height: 330px; left: calc(12% - 210px); top: calc(10% - 165px); background: radial-gradient(ellipse at center, rgba(0, 240, 255, 0.35) 0%, rgba(0, 240, 255, 0) 65%); }
    .blob-3 { width: 420px; height: 330px; left: calc(88% - 210px); top: calc(26% - 165px); background: radial-gradient(ellipse at center, rgba(255, 110, 220, 0.36) 0%, rgba(255, 110, 220, 0) 65%); }
    .blob-4 { width: 520px; height: 400px; left: calc(30% - 260px); top: calc(40% - 200px); background: radial-gradient(ellipse at center, rgba(140, 90, 255, 0.40) 0%, rgba(140, 90, 255, 0) 65%); }
    .blob-5 { width: 340px; height: 260px; left: calc(70% - 170px); top: calc(62% - 130px); background: radial-gradient(ellipse at center, rgba(120, 80, 255, 0.15) 0%, rgba(120, 80, 255, 0) 60%); }
    .blob-6 { width: 210px; height: 160px; left: calc(74% - 105px); top: calc(76% - 80px); background: radial-gradient(ellipse at center, rgba(0, 220, 255, 0.16) 0%, rgba(0, 220, 255, 0) 60%); }
    .blob-7 { width: 340px; height: 260px; left: calc(16% - 170px); top: calc(88% - 130px); background: radial-gradient(ellipse at center, rgba(255, 90, 200, 0.14) 0%, rgba(255, 90, 200, 0) 60%); }
    .blob-8 { width: 210px; height: 160px; left: calc(60% - 105px); top: calc(95% - 80px); background: radial-gradient(ellipse at center, rgba(140, 90, 255, 0.10) 0%, rgba(140, 90, 255, 0) 60%); }

  <script>
    /* 光斑弹性互动 */
    (function () {
      var blobs = Array.prototype.slice.call(document.querySelectorAll('.glow-blob'));
      var lastHover = null;
      function isInside(rect, x, y) {
        var cx = rect.left + window.pageXOffset + rect.width / 2;
        var cy = rect.top + window.pageYOffset + rect.height / 2;
        var dx = (x - cx) / (rect.width / 2);
        var dy = (y - cy) / (rect.height / 2);
        return dx * dx + dy * dy <= 1;
      }
      document.addEventListener('mousemove', function (e) {
        var x = e.pageX, y = e.pageY, found = null;
        for (var i = 0; i < blobs.length; i++) {
          if (isInside(blobs[i].getBoundingClientRect(), x, y)) { found = blobs[i]; break; }
        }
        if (found === lastHover) return;
        if (lastHover) {
          lastHover.classList.remove('pressed');
          lastHover.classList.add('bounce');
        }
        if (found) {
          found.classList.remove('bounce');
          found.classList.add('pressed');
        }
        lastHover = found;
      });
      document.addEventListener('transitionend', function (e) {
        if (e.target && e.target.classList) e.target.classList.remove('bounce');
      });
    })();
  </script>

  <script>
    // 毕设作品数据（和 projects.html 保持一致）

      { id: 1, title: "乡隅守望农村妇女在地增收服务设计", author: "韩冰", boards: ["project1_1.jpg", "project1_2.jpg", "project1_3.jpg", "project1_4.jpg"] },

      { id: 3, title: "家用血钾监测仪多模态预警交互系统设计", author: "侯江伟", boards: ["project3_1.jpg", "project3_2.jpg"] },
      { id: 4, title: "面向农业育种的无人机交互系统设计", author: "李潘", boards: ["project4_1.jpg", "project4_2.jpg", "project4_3.jpg"] },
      { id: 5, title: "城乡技术迁移下MR赋能农户技能学习的熟人社交与涂鸦引流服务设计", author: "孟拓", boards: ["project5_1.jpg", "project5_2.jpg"] },
      { id: 6, title: "农知旅人-基于VR的农业技术体验设计", author: "严行", boards: ["project6_1.jpg", "project6_2.jpg"] },
      { id: 7, title: "基于服务设计思维的农用无人机多载荷模块化产品设计", author: "杨雅雯", boards: ["project7_1.jpg", "project7_2.jpg", "project7_3.jpg", "project7_4.jpg"] },

      { id: 9, title: "面向名优茶机械化采摘的采茶机优化设计", author: "刘思敏", boards: ["project9_1.jpg", "project9_2.jpg", "project9_3.jpg", "project9_4.jpg"] },
      { id: 10, title: "基于可适应性及模块化可穿戴外骨骼设计", author: "邢贞获", boards: ["project10_1.jpg", "project10_2.jpg"] },
      { id: 11, title: "激发乡村内生动力的服务设计", author: "周小雨", boards: ["project11_1.jpg", "project11_2.jpg", "project11_3.jpg"] },
      { id: 12, title: "HTO术前VR决策系统设计", author: "曹骞予 · 张寞轩", boards: ["project12_1.jpg", "project12_2.jpg", "project12_3.jpg", "project12_4.jpg"] },
      { id: 13, title: "禾火新生—农民断代背景下EcoCube生态农铺", author: "黄玉冰", boards: ["project13_1.jpg", "project13_2.jpg"] },
      { id: 14, title: "基于心流理论的沉浸式乐器陪练系统", author: "于渤", boards: ["project14_1.jpg"] },
      { id: 15, title: "三轨滑轨沙发", author: "尹欣 · 苏俊旭", boards: ["project15_1.jpg"] },
      { id: 16, title: "中医治未病理念下家庭健康自检设备设计", author: "马伊玟 · 苏俊旭", boards: ["project16_1.jpg"] },
      { id: 17, title: "叙事化团泊镇文化IP及衍生品设计", author: "申琰硕 · 苏俊旭", boards: ["project17_1.jpg"] },
      { id: 18, title: "情绪亚健康青年自我庇护家居设计", author: "苏小铭 · 苏俊旭", boards: ["project18_1.jpg"] }
    ];

    // 获取URL参数
    function getParam(name) {
      var params = new URLSearchParams(location.search);
      return params.get(name);
    }

    var currentIndex = 0;
    var project = null;

    function initDetail() {
      var id = parseInt(getParam('id')) || 1;
      project = graduationProjects.find(function(p) { return p.id === id; });
      if (!project) project = graduationProjects[0];

      // 填充标题和作者
      document.getElementById('workTitle').textContent = project.title;
      document.getElementById('workAuthor').textContent = project.author;
      document.title = project.title + ' | Weave Lab';

      // 设置主图
      var mainImg = document.getElementById('mainImage');
      mainImg.src = '../images/graduation/' + project.boards[0];
      mainImg.alt = project.title;

      // 生成缩略图
      var thumbsContainer = document.getElementById('thumbsContainer');
      thumbsContainer.innerHTML = '';
      project.boards.forEach(function(board, idx) {
        var thumb = document.createElement('div');
        thumb.className = 'grad-gallery-thumb' + (idx === 0 ? ' active' : '');
        thumb.innerHTML = '<img src="../images/graduation/' + board + '" alt="第' + (idx + 1) + '张">';
        thumb.addEventListener('click', function() { goTo(idx); });
        thumbsContainer.appendChild(thumb);
      });

      updateCount();

      // 只有1张图就隐藏箭头和计数
      if (project.boards.length <= 1) {
        document.getElementById('prevBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('imgCount').style.display = 'none';
        thumbsContainer.style.display = 'none';
      }
    }

    function goTo(idx) {
      if (!project || project.boards.length <= 1) return;
      currentIndex = (idx + project.boards.length) % project.boards.length;

      var mainImg = document.getElementById('mainImage');
      mainImg.style.opacity = '0';
      setTimeout(function() {
        mainImg.src = '../images/graduation/' + project.boards[currentIndex];
        mainImg.style.opacity = '1';
      }, 150);

      // 更新缩略图高亮
      var thumbs = document.querySelectorAll('.grad-gallery-thumb');
      thumbs.forEach(function(t, i) {
        t.classList.toggle('active', i === currentIndex);
      });

      updateCount();
    }

    function updateCount() {
      document.getElementById('imgCount').textContent = (currentIndex + 1) + ' / ' + (project ? project.boards.length : 1);
    }

    document.addEventListener('DOMContentLoaded', function() {
      initDetail();

      document.getElementById('prevBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        goTo(currentIndex - 1);
      });
      document.getElementById('nextBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        goTo(currentIndex + 1);
      });

      // 键盘左右切换
      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') goTo(currentIndex - 1);
        if (e.key === 'ArrowRight') goTo(currentIndex + 1);
      });
    });
  </script>
