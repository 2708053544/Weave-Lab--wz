<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>指导老师 | Weave Lab 智能体验与服务工程实验室</title>
  <meta name="description" content="Weave Lab 指导老师团队">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/mentors-3d.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://miaoda.feishu.cn/fonts/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="m3-page" style="background: #050508; color: #fff; overflow: hidden;">

  <div class="m3-root m3-booting">
    <!-- 背景光晕 -->
    <div class="m3-glow-field" aria-hidden="true">
      <div class="m3-glow g1"></div>
      <div class="m3-glow g2"></div>
      <div class="m3-glow g3"></div>
    </div>
    <div class="m3-grain" aria-hidden="true"></div>

    <!-- 返回 -->
    <a href="about.html" class="m3-back">← 返回团队</a>

    <!-- 计数 -->
    <div class="m3-counter">
      <span class="cur" id="m3Cur">01</span>
      <span> / 0<span id="m3Total">4</span></span>
    </div>

    <!-- 左侧文字区 -->
    <div class="m3-info">
      <div class="m3-info-label">Our Mentors</div>
      <h1 class="m3-info-name" id="m3Name">老师名称占位一</h1>
      <p class="m3-info-title" id="m3Title">教授 / 博士生导师 / 研究方向主任</p>
      <span class="m3-info-hint">滚动切换 · 点击卡片查看详情</span>
    </div>

    <!-- 右侧 3D 卡片堆 -->
    <div class="m3-stage">
      <div class="m3-stack" id="m3Stack"><!-- JS 渲染 --></div>
    </div>

    <!-- 导航点 -->
    <div class="m3-dots" id="m3Dots"></div>

    <!-- 左右箭头 -->
    <div class="m3-arrow prev" aria-label="上一位">←</div>
    <div class="m3-arrow next" aria-label="下一位">→</div>

    <!-- 底部提示 -->
    <div class="m3-scroll-hint">
      <div class="line"></div>
      <span>Scroll / Swipe</span>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/mentors-3d.js"></script>
  <script>
    document.getElementById('m3Total').textContent = TEACHERS.length;
  </script>
</body>
</html>
