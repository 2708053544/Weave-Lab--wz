      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

      pointer-events: none;
      will-change: transform;
      transition: transform 0.28s cubic-bezier(0.25, 0.1, 0.3, 1), opacity 0.28s ease;

    .glow-blob.pressed {
      transform: scale(0.82, 0.86);
      opacity: 0.88;
    }

    }

  <script>
    /* 光斑弹性互动：鼠标移到光斑上它会凹陷下去，移开后 QQ 弹弹地弹回 */
    (function () {
      var blobs = Array.prototype.slice.call(document.querySelectorAll('.glow-blob'));
      var lastHover = null;
      function isInside(rect, x, y) {
        var cx = rect.left + window.pageXOffset + rect.width / 2;
        var cy = rect.top + window.pageYOffset + rect.height / 2;
        var dx = (x - cx) / (rect.width / 2);
        var dy = (y - cy) / (rect.height / 2);
        return dx * dx + dy * dy <= 1;
      }
      document.addEventListener('mousemove', function (e) {
        var x = e.pageX, y = e.pageY, found = null;
        for (var i = 0; i < blobs.length; i++) {
          if (isInside(blobs[i].getBoundingClientRect(), x, y)) { found = blobs[i]; break; }
        }
        if (found === lastHover) return;
        if (lastHover) {
          lastHover.classList.remove('pressed');
          lastHover.classList.add('bounce');
        }
        if (found) {
          found.classList.remove('bounce');
          found.classList.add('pressed');
        }
        lastHover = found;
      });
      document.addEventListener('transitionend', function (e) {
        if (e.target && e.target.classList) e.target.classList.remove('bounce');
      });
    })();
  </script>
