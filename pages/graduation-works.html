  <style>
    .graduation-works-section {
      padding: 100px 0 80px;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }
    .graduation-works-header {
      text-align: center;
      margin-bottom: 48px;
      padding: 0 40px;
    }
    .graduation-masonry {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 36px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .gwork-card {
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .gwork-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(79, 107, 255, 0.25);
    }
    .gwork-board {
      position: relative;
      width: 100%;
      aspect-ratio: 3/4;
      overflow: hidden;
      border-radius: 6px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      transition: border-color 0.3s ease;
    }
    .gwork-card:hover .gwork-board {
      border-color: rgba(79, 107, 255, 0.4);
    }
    .gwork-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .gwork-slide.active {
      position: relative;
      opacity: 1;
    }
    .gwork-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .gwork-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease, background 0.3s ease;
      z-index: 3;
      backdrop-filter: blur(8px);
    }
    .gwork-board:hover .gwork-arrow {
      opacity: 1;
    }
    .gwork-arrow:hover {
      background: rgba(0, 0, 0, 0.6) !important;
    }
    .gwork-arrow.prev { left: 8px; }
    .gwork-arrow.next { right: 8px; }
    .gwork-arrow svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .gwork-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      z-index: 2;
    }
    .gwork-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .gwork-dot.active {
      width: 16px;
      border-radius: 3px;
      background: #fff;
    }
    .gwork-count {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 3px 8px;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 0.6875rem;
      border-radius: 10px;
      z-index: 2;
      backdrop-filter: blur(8px);
    }
    .gwork-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 18px 14px;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 4;
    }
    .gwork-title {
      font-size: 0.9375rem;
      font-weight: 500;
      color: #fff;
      margin: 0 0 4px 0;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .gwork-author {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.75);
      margin: 0;
    }
    @media (max-width: 1200px) {
      .graduation-masonry { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .graduation-masonry { grid-template-columns: repeat(2, 1fr); gap: 20px 14px; }
      .gwork-title { font-size: 0.8125rem; }
      .gwork-author { font-size: 0.6875rem; }
    }
    @media (max-width: 480px) {
      .graduation-masonry { grid-template-columns: 1fr; max-width: 280px; }
    }
  </style>

  <style>
    /* 背景装饰光斑层 */
    .glow-layer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .glow-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform;
      transition: transform 0.28s cubic-bezier(0.25, 0.1, 0.3, 1), opacity 0.28s ease;
    }
    .glow-blob.pressed {
      transform: scale(0.82, 0.86);
      opacity: 0.88;
    }
    .glow-blob.bounce {
      transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
    }
    .blob-1 { width: 1092px; height: 858px; left: calc(100% - 546px); top: -429px; background: radial-gradient(ellipse at center, rgba(170, 80, 255, 0.35) 0%, rgba(170, 80, 255, 0) 65%); }

    .blob-3 { width: 420px; height: 330px; left: calc(88% - 210px); top: calc(26% - 165px); background: radial-gradient(ellipse at center, rgba(255, 110, 220, 0.36) 0%, rgba(255, 110, 220, 0) 65%); }
    .blob-4 { width: 520px; height: 400px; left: calc(30% - 260px); top: calc(40% - 200px); background: radial-gradient(ellipse at center, rgba(140, 90, 255, 0.40) 0%, rgba(140, 90, 255, 0) 65%); }

    .blob-7 { width: 340px; height: 260px; left: calc(16% - 170px); top: calc(88% - 130px); background: radial-gradient(ellipse at center, rgba(255, 90, 200, 0.14) 0%, rgba(255, 90, 200, 0) 60%); }
    .blob-8 { width: 210px; height: 160px; left: calc(60% - 105px); top: calc(95% - 80px); background: radial-gradient(ellipse at center, rgba(140, 90, 255, 0.10) 0%, rgba(140, 90, 255, 0) 60%); }
    @media (max-width: 768px) {

      .blob-5 { width: 200px; height: 150px; left: calc(70% - 100px); top: calc(62% - 75px); }

      .blob-8 { width: 130px; height: 100px; left: calc(60% - 65px); top: calc(95% - 50px); }
    }

  <script>
    const graduationProjects = [
      { id: 1, title: "乡隅守望农村妇女在地增收服务设计", author: "韩冰", excellent: true, boards: ["project1_1.jpg", "project1_2.jpg", "project1_3.jpg", "project1_4.jpg"] },

      { id: 3, title: "家用血钾监测仪多模态预警交互系统设计", author: "侯江伟", excellent: true, boards: ["project3_1.jpg", "project3_2.jpg"] },
      { id: 4, title: "面向农业育种的无人机交互系统设计", author: "李潘", boards: ["project4_1.jpg", "project4_2.jpg", "project4_3.jpg"] },
      { id: 5, title: "城乡技术迁移下MR赋能农户技能学习的熟人社交与涂鸦引流服务设计", author: "孟拓", boards: ["project5_1.jpg", "project5_2.jpg"] },
      { id: 6, title: "农知旅人-基于VR的农业技术体验设计", author: "严行", boards: ["project6_1.jpg", "project6_2.jpg"] },
      { id: 7, title: "基于服务设计思维的农用无人机多载荷模块化产品设计", author: "杨雅雯", boards: ["project7_1.jpg", "project7_2.jpg", "project7_3.jpg", "project7_4.jpg"] },
      { id: 8, title: "面向HTO骨科手术机器人的全流程VR系统设计", author: "曹骞予", boards: ["project8_1.jpg", "project8_2.jpg", "project8_3.jpg", "project8_4.jpg"] },
      { id: 9, title: "面向名优茶机械化采摘的采茶机优化设计", author: "刘思敏", boards: ["project9_1.jpg", "project9_2.jpg", "project9_3.jpg", "project9_4.jpg"] },
      { id: 10, title: "基于可适应性及模块化可穿戴外骨骼设计", author: "邢贞获", boards: ["project10_1.jpg", "project10_2.jpg"] },
      { id: 11, title: "激发乡村内生动力的服务设计", author: "周小雨", boards: ["project11_1.jpg", "project11_2.jpg", "project11_3.jpg"] },
      { id: 12, title: "HTO术前VR决策系统设计", author: "曹骞予 · 张寞轩", excellent: true, boards: ["project12_1.jpg", "project12_2.jpg", "project12_3.jpg", "project12_4.jpg"] },
      { id: 13, title: "禾火新生—农民断代背景下EcoCube生态农铺", author: "黄玉冰", excellent: true, boards: ["project13_1.jpg", "project13_2.jpg"] },
      { id: 14, title: "基于心流理论的沉浸式乐器陪练系统", author: "于渤", excellent: true, boards: ["project14_1.jpg"] },
      { id: 15, title: "三轨滑轨沙发", author: "尹欣 · 苏俊旭", boards: ["project15_1.jpg"] },
      { id: 16, title: "中医治未病理念下家庭健康自检设备设计", author: "马伊玟 · 苏俊旭", boards: ["project16_1.jpg"] },
      { id: 17, title: "叙事化团泊镇文化IP及衍生品设计", author: "申琰硕 · 苏俊旭", boards: ["project17_1.jpg"] },
      { id: 18, title: "情绪亚健康青年自我庇护家居设计", author: "苏小铭 · 苏俊旭", boards: ["project18_1.jpg"] }
    ];

    function renderGraduationWorks() {
      const masonry = document.getElementById('graduationMasonry');
      if (!masonry) return;

      graduationProjects.forEach(function(project) {
        const card = document.createElement('div');
        card.className = 'gwork-card';
        card.onclick = function() {
          location.href = 'graduation-detail.html?id=' + project.id;
        };

        let slidesHtml = '';
        project.boards.forEach(function(board, idx) {
          slidesHtml += '<div class="gwork-slide' + (idx === 0 ? ' active' : '') + '">' +
            '<img src="../images/graduation/' + board + '" alt="' + project.title + '" loading="lazy">' +
            '</div>';
        });

        const arrowLeft = '<button class="gwork-arrow prev" aria-label="上一张"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>';
        const arrowRight = '<button class="gwork-arrow next" aria-label="下一张"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>';
        const countBadge = '<div class="gwork-count">1 / ' + project.boards.length + '</div>';

        let dotsHtml = '<div class="gwork-dots">';
        project.boards.forEach(function(_, idx) {
          dotsHtml += '<span class="gwork-dot' + (idx === 0 ? ' active' : '') + '" data-index="' + idx + '"></span>';
        });
        dotsHtml += '</div>';

        card.innerHTML = '<div class="gwork-board" data-project="' + project.id + '">' +
          countBadge + slidesHtml + arrowLeft + arrowRight + dotsHtml +
          '<div class="gwork-info">' +
          '<h3 class="gwork-title">' + project.title + '</h3>' +
          '<p class="gwork-author">' + project.author + '</p>' +
          '</div></div>';

        masonry.appendChild(card);
      });

      bindCarousels();
    }

    function bindCarousels() {
      const carousels = document.querySelectorAll('.gwork-board');
      carousels.forEach(function(carousel) {
        const slides = carousel.querySelectorAll('.gwork-slide');
        const dots = carousel.querySelectorAll('.gwork-dot');
        const countBadge = carousel.querySelector('.gwork-count');
        const prevBtn = carousel.querySelector('.gwork-arrow.prev');
        const nextBtn = carousel.querySelector('.gwork-arrow.next');
        let current = 0;
        const total = slides.length;

        function goTo(index) {
          slides[current].classList.remove('active');
          slides[current].style.position = 'absolute';
          dots[current].classList.remove('active');
          current = index;
          slides[current].classList.add('active');
          slides[current].style.position = 'relative';
          dots[current].classList.add('active');
          if (countBadge) countBadge.textContent = (current + 1) + ' / ' + total;
        }

        prevBtn.addEventListener('click', function(e) { e.stopPropagation(); goTo((current - 1 + total) % total); });
        nextBtn.addEventListener('click', function(e) { e.stopPropagation(); goTo((current + 1) % total); });
        dots.forEach(function(dot, idx) {
          dot.addEventListener('click', function(e) { e.stopPropagation(); goTo(idx); });
        });
        // 点击卡片任意位置跳转详情（箭头/圆点切换在各自监听里已 stopPropagation）
      });
    }

    document.addEventListener('DOMContentLoaded', renderGraduationWorks);
  </script>

  <script>
    /* 光斑弹性互动：鼠标移到光斑上它会凹陷下去，移开后 QQ 弹弹地弹回 */
    (function () {
      var blobs = Array.prototype.slice.call(document.querySelectorAll('.glow-blob'));
      var lastHover = null;
      function isInside(rect, x, y) {
        var cx = rect.left + window.pageXOffset + rect.width / 2;
        var cy = rect.top + window.pageYOffset + rect.height / 2;
        var dx = (x - cx) / (rect.width / 2);
        var dy = (y - cy) / (rect.height / 2);
        return dx * dx + dy * dy <= 1;
      }
      document.addEventListener('mousemove', function (e) {
        var x = e.pageX, y = e.pageY, found = null;
        for (var i = 0; i < blobs.length; i++) {
          if (isInside(blobs[i].getBoundingClientRect(), x, y)) { found = blobs[i]; break; }
        }
        if (found === lastHover) return;
        if (lastHover) {
          lastHover.classList.remove('pressed');
          lastHover.classList.add('bounce');
        }
        if (found) {
          found.classList.remove('bounce');
          found.classList.add('pressed');
        }
        lastHover = found;
      });
      document.addEventListener('transitionend', function (e) {
        if (e.target && e.target.classList) e.target.classList.remove('bounce');
      });
    })();
  </script>
